[project]
name = "hermes-atlas"
version = "0.1.0"
description = "Atlas: a Hermes plugin that keeps your Pursuits current and pushes you to continue them."
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["zstandard>=0.22,<1", "mcp>=2.0,<3", "pyyaml>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "fastapi>=0.115,<1", "httpx>=0.27,<1"]
demo = ["pillow>=10.1,<13", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
