name: CI

# Runs when a commit lands on main or hackathon, and on demand from the Actions tab.
# Work branches and pull requests do not start a run.
on:
  push:
    branches: [main, hackathon]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      # The proof harness lives in the development repo only; the public export leaves it out.
      - name: Proof harness (fails when a claimed scene fails, or a scene fails in week mode)
        if: hashFiles('tests/harness/__main__.py') != ''
        working-directory: tests
        run: python -m harness
