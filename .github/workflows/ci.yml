name: CI

# Runs when a commit lands on main, and on demand from the Actions tab.
# Work branches and pull requests do not start a run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      # The proof harness lives in the development repo only; the public export leaves it out.
      - name: Proof harness (fails when a claimed scene fails, or a scene fails in week mode)
        if: hashFiles('tests/harness/__main__.py') != ''
        working-directory: tests
        run: python -m harness
